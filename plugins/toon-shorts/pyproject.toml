[project]
name = "toon-shorts"
version = "1.1.0"
description = "Claude Code skill: story -> script -> voice -> animated 1080x1920 cartoon short"
requires-python = ">=3.11"
license = "MIT"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skills/toon-shorts/scripts"]
addopts = "-q --cov=toonshorts --cov-report=term-missing:skip-covered --cov-fail-under=85"

[tool.coverage.run]
branch = true
source = ["skills/toon-shorts/scripts/toonshorts"]

[tool.pyright]
extraPaths = ["skills/toon-shorts/scripts"]
venvPath = "../.."
venv = ".venv"
