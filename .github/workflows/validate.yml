name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install ffmpeg (Premiere and Video Creator render tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.328
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugins
        run: for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Generated files in sync with units.json
        run: node tools/sync-army.js --check
      - name: Token budget (always-loaded descriptions per plugin)
        run: node tools/token-budget.js --check
      - name: Video Creator style commands in sync with styles.json
        run: node plugins/video-creator/scripts/gen-skills.js --check
      - name: Army tests (gate + lifecycle)
        run: node --test plugins/army/tests/*.test.js
      - name: Map builds
        run: node plugins/army/scripts/build-map.js --out /tmp/army-map.html
      - name: Node plugin tests (court, customs, er, atc, critics, skill-installer, mission-control, academy, archive, newsroom, premiere, video-creator)
        run: for p in court customs er atc critics skill-installer mission-control academy archive newsroom premiere video-creator; do node --test plugins/$p/tests/*.test.js || exit 1; done

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Examples are valid
        run: for f in skills/produce/examples/*.json; do python skills/produce/scripts/studio.py check "$f"; done
      - name: Tests
        run: python -m pytest
      - name: Files stay under 200 lines
        run: '! find skills tests -name "*.py" -exec awk ''END { if (NR > 200) print FILENAME }'' {} \; | grep .'

  toon-shorts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/toon-shorts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Examples are valid
        run: for f in skills/toon-shorts/examples/*.json; do python skills/toon-shorts/scripts/toon.py check "$f"; done
      - name: Tests (coverage gate 85%)
        run: python -m pytest
      - name: Files stay under 200 lines
        run: '! find skills tests -name "*.py" -exec awk ''END { if (NR > 200) print FILENAME }'' {} \; | grep .'
