name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.328
      - name: Validate marketplace
        run: claude plugin validate .
      - name: Validate plugins
        run: for p in plugins/*/; do claude plugin validate "$p"; done
      - name: Generated files in sync with units.json
        run: node tools/sync-army.js --check
      - name: Army tests (gate, lifecycle and the 8 drills)
        run: node --test plugins/army/tests/*.test.js
      - name: Map builds
        run: node plugins/army/scripts/build-map.js --out /tmp/army-map.html
      - name: Node plugin tests (skill-installer, studio film helper)
        run: for p in skill-installer studio; do node --test plugins/$p/tests/*.test.js || exit 1; done

  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/studio
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install pinned dev dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Examples are valid
        run: for f in skills/produce/examples/*.json; do python skills/produce/scripts/studio.py check "$f"; done
      - name: Toon examples are valid
        run: for f in skills/toon/examples/*.json; do python skills/toon/scripts/toon.py check "$f"; done
      - name: Explainer tests (coverage gate 80%)
        run: python -m pytest
      - name: Toon tests (coverage gate 85%)
        run: python -m pytest toon-tests
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Film helper tests
        run: node --test tests/*.test.js
      - name: Files stay under 200 lines
        run: '! find skills tests toon-tests -name "*.py" -exec awk ''END { if (NR > 200) print FILENAME }'' {} \; | grep .'

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Node plugin tests (all suites run, then the job fails if any failed)
        run: |
          failed=""
          for p in army skill-installer studio; do node --test plugins/$p/tests/*.test.js || failed="$failed $p"; done
          if [ -n "$failed" ]; then echo "::error::failed:$failed"; exit 1; fi
      - name: Studio tests (explainer and toon engines)
        working-directory: plugins/studio
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt && python -m pytest && python -m pytest toon-tests
